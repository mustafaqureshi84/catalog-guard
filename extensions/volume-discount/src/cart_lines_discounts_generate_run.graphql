query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          sku
          product {
            id
            title
          }
        }
      }
    }
  }
  discount {
    discountClasses
    # Configuration written by the settings UI. A function cannot fetch
    # anything at runtime, so this is the only way merchant settings reach it.
    metafield(namespace: "$app", key: "function-configuration") {
      value
    }
  }
}